<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diseño del proyecto</title>
<style>
  :root {
    --bg: #f3f5f8;
    --surface: #ffffff;
    --text: #1b2430;
    --muted: #556070;
    --line: #d5dbe4;
    --accent: #1f5fbf;
    --ok-bg: #d9f0e1;
    --ok-text: #14532d;
    --wait-bg: #fde8c8;
    --wait-text: #7a3e00;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11161d;
      --surface: #1a212b;
      --text: #e6ebf2;
      --muted: #9aa6b6;
      --line: #2e3745;
      --accent: #7fb0ff;
      --ok-bg: #173a27;
      --ok-text: #9be0b4;
      --wait-bg: #47300f;
      --wait-text: #f5c987;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 56px; }
  h1 { font-size: 1.75rem; line-height: 1.2; margin: 0 0 8px; }
  .lead { color: var(--muted); margin: 0 0 24px; max-width: 60ch; }
  .summary { display: flex; flex-wrap: wrap; gap: 12px; margin: 0 0 24px; padding: 0; list-style: none; }
  .summary li {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px 16px;
    min-width: 120px;
  }
  .summary strong { display: block; font-size: 1.5rem; line-height: 1.2; }
  .summary span { color: var(--muted); font-size: 0.875rem; }
  #list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .piece {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
  }
  .piece-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
  .piece h2 { font-size: 1.125rem; margin: 0; }
  .badge { font-size: 0.8125rem; font-weight: 600; padding: 4px 10px; border-radius: 6px; }
  .badge.decidido { background: var(--ok-bg); color: var(--ok-text); }
  .badge.pendiente { background: var(--wait-bg); color: var(--wait-text); }
  .badge.otro { background: var(--bg); color: var(--text); border: 1px solid var(--line); }
  .bad-link { display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; color: var(--wait-text); }
  .options { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0; padding: 0; list-style: none; }
  .options a {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    padding: 0 16px;
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
    transition: background-color 150ms, border-color 150ms;
  }
  .options a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  @media (hover: hover) {
    .options a:hover { border-color: var(--accent); background: var(--bg); }
  }
  .none { color: var(--muted); margin: 12px 0 0; font-size: 0.9375rem; }
  .empty { color: var(--muted); }
  .error { color: var(--wait-text); background: var(--wait-bg); border-radius: var(--radius); padding: 12px 16px; }
  @media (prefers-reduced-motion: reduce) {
    .options a { transition: none; }
  }
</style>
</head>
<body>
<main>
  <h1>Diseño del proyecto</h1>
  <p class="lead">Cada pieza grande tiene tres opciones para comparar. Abrí las que quieras; el estado dice si ya se eligió una.</p>
  <ul class="summary" aria-live="polite">
    <li><strong id="count-total">0</strong><span>piezas</span></li>
    <li><strong id="count-decidido">0</strong><span>decididas</span></li>
    <li><strong id="count-pendiente">0</strong><span>pendientes</span></li>
  </ul>
  <ul id="list"></ul>
</main>

<!-- Datos de las piezas. El agente reescribe SOLO este bloque cuando cambia el estado o se suma una pieza.
     Cada pieza: { "name": "Identidad visual", "status": "decidido" o "pendiente",
     "options": ["options/identity/a.html", "options/identity/b.html", "options/identity/c.html"] }.
     options: solo rutas relativas a esta carpeta (design/) que terminan en .html; cualquier otra no se vuelve enlace. -->
<script id="data" type="application/json">
{
  "pieces": []
}
</script>

<script>
(function () {
  var pieces = [];
  var broken = false;
  try {
    pieces = JSON.parse(document.getElementById('data').textContent).pieces;
    if (!Array.isArray(pieces)) { throw new Error('pieces'); }
  } catch (e) {
    pieces = [];
    broken = true;
  }
  var list = document.getElementById('list');
  var counts = { decidido: 0, pendiente: 0 };
  // Only a relative path to an .html file inside this folder becomes a link: no scheme, no leading slash, no "..".
  var SAFE_HREF = /^(?![A-Za-z][A-Za-z0-9+.-]*:)(?!\/)(?!.*\.\.)[A-Za-z0-9._\/-]+\.html$/;

  if (broken) {
    // A corrupt record is not an empty list: say so instead of "nothing decided yet".
    var bad = document.createElement('li');
    bad.className = 'empty error';
    bad.setAttribute('role', 'alert');
    bad.textContent = 'Los datos de este índice están dañados; pedí regenerarlo.';
    list.appendChild(bad);
  } else if (pieces.length === 0) {
    var empty = document.createElement('li');
    empty.className = 'empty';
    empty.textContent = 'Todavía no hay piezas. Se suman cuando haya algo que decidir.';
    list.appendChild(empty);
  }

  pieces.forEach(function (piece) {
    // An unknown status is shown as it is written, never silently turned into "pendiente".
    var known = piece.status === 'decidido' || piece.status === 'pendiente';
    var status = known ? piece.status : (piece.status === undefined || piece.status === null ? 'sin estado' : String(piece.status));
    if (known) { counts[status] += 1; }

    var item = document.createElement('li');
    item.className = 'piece';

    var head = document.createElement('div');
    head.className = 'piece-head';
    var title = document.createElement('h2');
    title.textContent = piece.name;
    var badge = document.createElement('span');
    badge.className = 'badge ' + (known ? status : 'otro');
    badge.textContent = status;
    head.appendChild(title);
    head.appendChild(badge);
    item.appendChild(head);

    var options = piece.options || [];
    if (options.length === 0) {
      var none = document.createElement('p');
      none.className = 'none';
      none.textContent = 'Sin opciones: se resolvió directo.';
      item.appendChild(none);
    } else {
      var ul = document.createElement('ul');
      ul.className = 'options';
      options.forEach(function (href, i) {
        var li = document.createElement('li');
        var letter = String.fromCharCode(65 + i);
        if (typeof href === 'string' && SAFE_HREF.test(href)) {
          var a = document.createElement('a');
          a.href = href;
          a.textContent = 'Opción ' + letter;
          a.setAttribute('aria-label', piece.name + ': opción ' + letter);
          li.appendChild(a);
        } else {
          var bad = document.createElement('span');
          bad.className = 'bad-link';
          bad.textContent = 'Opción ' + letter + ': ruta no válida';
          li.appendChild(bad);
        }
        ul.appendChild(li);
      });
      item.appendChild(ul);
    }
    list.appendChild(item);
  });

  document.getElementById('count-total').textContent = broken ? '–' : String(pieces.length);
  document.getElementById('count-decidido').textContent = broken ? '–' : String(counts.decidido);
  document.getElementById('count-pendiente').textContent = broken ? '–' : String(counts.pendiente);
})();
</script>
</body>
</html>
