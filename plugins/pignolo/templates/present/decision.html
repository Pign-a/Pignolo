<!doctype html>
<!-- pignolo-present: formato=decision version=1 -->
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Punto de decisión (ejemplo)</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--fg:#1c2330;--muted:#5b6575;--line:#d5dbe3;--accent:#1f5fbf}
@media (prefers-color-scheme:dark){:root{--bg:#141922;--card:#1d2430;--fg:#e6eaf0;--muted:#9aa5b5;--line:#2e3846;--accent:#6aa3f5}}
*{box-sizing:border-box}body{margin:0;padding:24px 16px;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
main{max-width:760px;margin:0 auto;display:grid;gap:16px}h1{font-size:1.4rem;margin:0}h2{font-size:1.05rem;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px}
.muted{color:var(--muted)}.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
[data-option]{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px}
.rec{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.tag{color:var(--accent);font-weight:600}
</style>
</head><body><main>
<h1>Elegir un camino <span class="muted">(datos de ejemplo)</span></h1>
<section class="card"><p>Los caminos se separan al decidir dónde se guarda el estado.</p></section>
<div class="grid">
<div data-option="archivo" class="rec"><h2>Archivo local <span class="tag">recomendado</span></h2><p class="muted">Costo bajo, se deshace borrando el archivo, riesgo bajo.</p></div>
<div data-option="base"><h2>Base de datos</h2><p class="muted">Costo medio, se deshace con una migración, riesgo medio.</p></div>
</div>
</main></body></html>
