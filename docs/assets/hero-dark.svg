<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Pignolo 2: resultados medidos</title><desc id="d">Cuatro cifras: 25 % menos de costo que superpowers, 5 % más que no usar plugin, 47 de 48 corridas aceptadas y 19 de 20 defectos detectados.</desc>
<rect x="0.5" y="0.5" width="879" height="319" rx="16" fill="#161b22" stroke="#30363d"/><text x="40" y="86" font-size="54" font-weight="800" fill="#f0f6fc" text-anchor="start">Pignolo 2</text><text x="40" y="120" font-size="18" font-weight="400" fill="#b1bac4" text-anchor="start">Un plugin de Claude Code que reemplaza a superpowers: pocas reglas y nada que bloquee.</text><rect x="40" y="150" width="188" height="124" rx="12" fill="#0d1117" stroke="#30363d"/><rect x="40" y="168" width="4" height="88" rx="2" fill="#3987e5"/><text x="62" y="202" font-size="38" font-weight="800" fill="#f0f6fc" text-anchor="start">−25 %</text><text x="62" y="228" font-size="14" font-weight="400" fill="#b1bac4" text-anchor="start">de costo frente a</text><text x="62" y="246" font-size="14" font-weight="400" fill="#b1bac4" text-anchor="start">superpowers</text><text x="62" y="264" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="start">razón 0,75 · 16 tareas reales</text><rect x="244" y="150" width="188" height="124" rx="12" fill="#0d1117" stroke="#30363d"/><rect x="244" y="168" width="4" height="88" rx="2" fill="#3987e5"/><text x="266" y="202" font-size="38" font-weight="800" fill="#f0f6fc" text-anchor="start">≈ +5 %</text><text x="266" y="228" font-size="14" font-weight="400" fill="#b1bac4" text-anchor="start">frente a no usar plugin</text><text x="266" y="246" font-size="14" font-weight="400" fill="#b1bac4" text-anchor="start">sin perder aceptación</text><text x="266" y="264" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="start">no inferior (margen 1,5)</text><rect x="448" y="150" width="188" height="124" rx="12" fill="#0d1117" stroke="#30363d"/><rect x="448" y="168" width="4" height="88" rx="2" fill="#3987e5"/><text x="470" y="202" font-size="38" font-weight="800" fill="#f0f6fc" text-anchor="start">47/48</text><text x="470" y="228" font-size="14" font-weight="400" fill="#b1bac4" text-anchor="start">corridas que pasan los</text><text x="470" y="246" font-size="14" font-weight="400" fill="#b1bac4" text-anchor="start">tests ocultos</text><text x="470" y="264" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="start">los tres brazos, un solo fallo</text><rect x="652" y="150" width="188" height="124" rx="12" fill="#0d1117" stroke="#30363d"/><rect x="652" y="168" width="4" height="88" rx="2" fill="#3987e5"/><text x="674" y="202" font-size="38" font-weight="800" fill="#f0f6fc" text-anchor="start">19/20</text><text x="674" y="228" font-size="14" font-weight="400" fill="#b1bac4" text-anchor="start">defectos sembrados</text><text x="674" y="246" font-size="14" font-weight="400" fill="#b1bac4" text-anchor="start">detectados al validar</text><text x="674" y="264" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="start">igual que superpowers</text><text x="40" y="302" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">Dos estudios preinscritos con datos propios · una app, un modelo, una repetición por celda · no demuestran una mejora de calidad</text></svg>
